# OSIRIS Strix backend.
#
# SECURITY: bound to 127.0.0.1 only — this service must never be reachable from
# the public internet. OSIRIS (running on the same host / trusted network) is
# the only intended caller. Only test targets you own or are authorized to test.

services:
  strix-backend:
    build: .
    container_name: osiris-strix-backend
    restart: unless-stopped
    # Publish on loopback only. Point OSIRIS's STRIX_URL at http://127.0.0.1:8700
    ports:
      - "127.0.0.1:8700:8700"
    env_file:
      - .env
    environment:
      # These have compose-level defaults but .env overrides them.
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      JOB_TIMEOUT: ${JOB_TIMEOUT:-3600}
    volumes:
      # Strix spins its own sandbox containers via the host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
