name: osiris-worldstate

# World-state persistence is intentionally separate from the existing OSIRIS
# stack. Keep running the dashboard and its current supporting services with:
#
#   docker compose -f docker-compose.yml up -d
#
# Start this file independently. The collector will be added here only after
# its package exists and can be built successfully.

x-postgis-image: &postgis-image postgis/postgis:16-3.5@sha256:e547a8319d5b134527c6d1e0307acde1311aa57f8eb7fbf78810dafc6a6b41fe

services:
  db:
    image: *postgis-image
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osiris_worldstate}
      POSTGRES_USER: ${POSTGRES_USER:-osiris}
      # Development fallback only. Set a unique value in .env before exposing
      # PostgreSQL beyond the loopback-only port binding below.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osiris-local-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - worldstate-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: *postgis-image
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Build the service-to-service URL from the database settings so custom
      # local credentials cannot desynchronise the migration connection.
      DATABASE_URL: postgresql://${POSTGRES_USER:-osiris}:${POSTGRES_PASSWORD:-osiris-local-dev}@db:5432/${POSTGRES_DB:-osiris_worldstate}
    entrypoint:
      - bash
      - /db/scripts/migrate.sh
    volumes:
      - ./db:/db:ro

  # Temporary infrastructure verification until the collector service is
  # available. Run explicitly with `--profile tools run --rm archive-check`.
  archive-check:
    image: alpine:3.21.3@sha256:a8560b36e8b8210634f77d9f7f9efd7ffa463e380b75e2e74aff4511df3ef88c
    profiles:
      - tools
    restart: "no"
    environment:
      RAW_ARCHIVE_PATH: ${RAW_ARCHIVE_PATH:-/archive}
    command:
      - /bin/sh
      - -ec
      - |
        test -d "$${RAW_ARCHIVE_PATH}"
        probe="$${RAW_ARCHIVE_PATH}/.osiris-write-check.$$$$"
        : > "$${probe}"
        rm -f "$${probe}"
        echo "Raw archive is writable: $${RAW_ARCHIVE_PATH}"
    volumes:
      - type: bind
        source: ./archive
        target: ${RAW_ARCHIVE_PATH:-/archive}
        bind:
          create_host_path: true

volumes:
  worldstate-db-data:
