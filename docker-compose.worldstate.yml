name: osiris-worldstate

# World-state persistence can still run separately from the existing OSIRIS
# stack when the dashboard uses live earthquake mode:
#
#   docker compose -f docker-compose.yml up -d
#
# For a database-backed dashboard, combine both Compose files so `osiris` and
# `db` share their default network. The collector waits for migrations before
# it begins its first bounded USGS collection attempt.

x-postgis-image: &postgis-image postgis/postgis:16-3.5@sha256:e547a8319d5b134527c6d1e0307acde1311aa57f8eb7fbf78810dafc6a6b41fe

services:
  db:
    image: *postgis-image
    # The official postgis/postgis image currently publishes amd64 only.
    # ARM64 hosts therefore require Docker/QEMU x86_64 emulation.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osiris_worldstate}
      POSTGRES_USER: ${POSTGRES_USER:-osiris}
      # Development fallback only. Set a unique value in .env before exposing
      # PostgreSQL beyond the loopback-only port binding below.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osiris-local-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${WORLDSTATE_DB_DATA:-worldstate-db-data}:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: *postgis-image
    platform: linux/amd64
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-osiris_worldstate}
      PGUSER: ${POSTGRES_USER:-osiris}
      PGPASSWORD: ${POSTGRES_PASSWORD:-osiris-local-dev}
      PGCONNECT_TIMEOUT: ${MIGRATION_DB_CONNECT_TIMEOUT_SECONDS:-10}
      PGOPTIONS: -c statement_timeout=${MIGRATION_DB_STATEMENT_TIMEOUT_MS:-120000} -c lock_timeout=${MIGRATION_DB_LOCK_TIMEOUT_MS:-15000}
    entrypoint:
      - bash
      - /db/scripts/migrate.sh
    volumes:
      - ./db:/db:ro

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    depends_on:
      migrate:
        condition: service_completed_successfully
      archive-check:
        condition: service_completed_successfully
    user: "${COLLECTOR_UID:-1000}:${COLLECTOR_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-osiris_worldstate}
      PGUSER: ${POSTGRES_USER:-osiris}
      PGPASSWORD: ${POSTGRES_PASSWORD:-osiris-local-dev}
      RAW_ARCHIVE_PATH: ${RAW_ARCHIVE_PATH:-/archive}
      USGS_EARTHQUAKE_URL: ${USGS_EARTHQUAKE_URL:-https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson}
      GDACS_RSS_URL: ${GDACS_RSS_URL:-https://www.gdacs.org/xml/rss.xml}
      FIRMS_VIIRS_URL: ${FIRMS_VIIRS_URL:-https://firms.modaps.eosdis.nasa.gov/data/active_fire/suomi-npp-viirs-c2/csv/SUOMI_VIIRS_C2_Global_24h.csv}
      FIRMS_MODIS_URL: ${FIRMS_MODIS_URL:-https://firms.modaps.eosdis.nasa.gov/data/active_fire/modis-c6.1/csv/MODIS_C6_1_Global_24h.csv}
      EONET_VOLCANOES_URL: ${EONET_VOLCANOES_URL:-https://eonet.gsfc.nasa.gov/api/v3/events?status=open&category=volcanoes&limit=50}
      EONET_WEATHER_URL: ${EONET_WEATHER_URL:-https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=100}
      NWS_ALERTS_URL: ${NWS_ALERTS_URL:-https://api.weather.gov/alerts/active?status=actual&message_type=alert}
      FEODO_IPBLOCKLIST_URL: ${FEODO_IPBLOCKLIST_URL:-https://feodotracker.abuse.ch/downloads/ipblocklist.json}
      URLHAUS_ONLINE_URL: ${URLHAUS_ONLINE_URL:-https://urlhaus.abuse.ch/downloads/csv_online/}
      CISA_KEV_URL: ${CISA_KEV_URL:-https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json}
      CELESTRAK_ACTIVE_TLE_URL: ${CELESTRAK_ACTIVE_TLE_URL:-https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle}
      CELESTRAK_STARLINK_TLE_URL: ${CELESTRAK_STARLINK_TLE_URL:-https://celestrak.org/NORAD/elements/supplemental/sup-gp.php?FILE=starlink&FORMAT=tle}
      SATNOGS_TLE_URL: ${SATNOGS_TLE_URL:-https://db.satnogs.org/api/tle/?format=json}
      SWPC_KP_URL: ${SWPC_KP_URL:-https://services.swpc.noaa.gov/json/planetary_k_index_1m.json}
      SWPC_ALERTS_URL: ${SWPC_ALERTS_URL:-https://services.swpc.noaa.gov/products/alerts.json}
      SWPC_XRAY_FLARES_URL: ${SWPC_XRAY_FLARES_URL:-https://services.swpc.noaa.gov/json/goes/primary/xray-flares-latest.json}
      COLLECTOR_SOURCE: ${COLLECTOR_SOURCE:-usgs-earthquakes}
      COLLECT_INTERVAL_MS: ${COLLECT_INTERVAL_MS:-300000}
      COLLECT_ON_STARTUP: ${COLLECT_ON_STARTUP:-1}
      MAX_FETCH_ATTEMPTS: ${MAX_FETCH_ATTEMPTS:-3}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-26214400}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-10000}
      RETRY_BASE_MS: ${RETRY_BASE_MS:-500}
      STALE_RUN_AFTER_MS: ${STALE_RUN_AFTER_MS:-900000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-15000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 4001
      LOG_LEVEL: ${COLLECTOR_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${COLLECTOR_HEALTH_PORT:-4001}:4001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - type: bind
        source: ${RAW_ARCHIVE_HOST_PATH:-./archive}
        target: ${RAW_ARCHIVE_PATH:-/archive}
        bind:
          create_host_path: false

  # Fail before collector startup if the host archive is absent or is not
  # writable by the configured non-root identity. It can also be run directly.
  archive-check:
    image: alpine:3.21.3@sha256:a8560b36e8b8210634f77d9f7f9efd7ffa463e380b75e2e74aff4511df3ef88c
    restart: "no"
    user: "${COLLECTOR_UID:-1000}:${COLLECTOR_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      RAW_ARCHIVE_PATH: ${RAW_ARCHIVE_PATH:-/archive}
    command:
      - /bin/sh
      - -ec
      - |
        test -d "$${RAW_ARCHIVE_PATH}"
        probe="$${RAW_ARCHIVE_PATH}/.osiris-write-check.$$$$"
        : > "$${probe}"
        rm -f "$${probe}"
        echo "Raw archive is writable: $${RAW_ARCHIVE_PATH}"
    volumes:
      - type: bind
        source: ${RAW_ARCHIVE_HOST_PATH:-./archive}
        target: ${RAW_ARCHIVE_PATH:-/archive}
        bind:
          create_host_path: false

volumes:
  worldstate-db-data:
